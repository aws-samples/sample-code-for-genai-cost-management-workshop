                  - iam:PassRole
                Resource: !GetAtt BedrockLoggingRole.Arn

  EnableBedrockLoggingLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Role has AWSLambdaBasicExecutionRole which includes CloudWatch Logs permissions
          - id: W89
            reason: Custom resource Lambda does not need VPC
          - id: W92
            reason: Custom resource Lambda does not need reserved concurrency
    Properties:
      FunctionName: !Sub
        - ${InstanceName}-EnableBedrockLogging-${RandomGUID}
        - RandomGUID: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId ]]]]
      Description: Enable Bedrock model invocation logging
      Handler: index.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 30
      Architectures:
        - arm64
      Role: !GetAtt EnableBedrockLoggingLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      bedrock = boto3.client('bedrock')
                      bedrock.delete_model_invocation_logging_configuration()
                      logger.info('Deleted model invocation logging configuration')
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  else:
                      props = event['ResourceProperties']
                      log_group_name = props['LogGroupName']
                      logging_role_arn = props['LoggingRoleArn']

                      bedrock = boto3.client('bedrock')
                      bedrock.put_model_invocation_logging_configuration(
                          loggingConfig={
                              'cloudWatchConfig': {
                                  'logGroupName': log_group_name,
                                  'roleArn': logging_role_arn
                              },
                              'textDataDeliveryEnabled': True,
                              'imageDataDeliveryEnabled': False,
                              'embeddingDataDeliveryEnabled': False
                          }
                      )
                      logger.info(f'Enabled model invocation logging to {log_group_name}')
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  logger.error(f'Error: {e}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(e))

  EnableBedrockLogging:
    Type: Custom::EnableBedrockLogging
    DependsOn:
      - BedrockLoggingLogGroup
      - BedrockLoggingRole
    Properties:
      ServiceToken: !GetAtt EnableBedrockLoggingLambda.Arn
      LogGroupName: !Ref BedrockLoggingLogGroup
      LoggingRoleArn: !GetAtt BedrockLoggingRole.Arn

Outputs:
  URL:
    Description: Code Editor URL
    Value: !Sub https://${CloudFrontDistribution.DomainName}/?folder=${HomeFolder}&tkn=${SecretPlaintext.password}
  CodeEditorURL:
    Description: Code Editor Base URL
    Value: !Sub https://${CloudFrontDistribution.DomainName}
  LiteLLMURL:
    Description: LiteLLM Proxy URL
    Value: !Sub https://${CloudFrontDistribution.DomainName}/litellm/ui/
