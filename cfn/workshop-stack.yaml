          CidrIp: 0.0.0.0/0

  ConfigureAthenaPrimaryWorkgroupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - ${InstanceName}-AthenaWorkgroupRole-${RandomGUID}
        - RandomGUID: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId ]]]]
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AthenaWorkgroupConfig
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - athena:UpdateWorkGroup
                  - athena:GetWorkGroup
                Resource: !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary

  ConfigureAthenaPrimaryWorkgroupLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Role has AWSLambdaBasicExecutionRole which includes CloudWatch Logs permissions
          - id: W89
            reason: Custom resource Lambda does not need VPC
          - id: W92
            reason: Custom resource Lambda does not need reserved concurrency
    Properties:
      FunctionName: !Sub
        - ${InstanceName}-AthenaWorkgroup-${RandomGUID}
        - RandomGUID: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId ]]]]
      Description: Configure the Athena primary workgroup output location
      Handler: index.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 30
      Architectures:
        - arm64
      Role: !GetAtt ConfigureAthenaPrimaryWorkgroupRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              try:
                  athena = boto3.client('athena')
                  if event['RequestType'] == 'Delete':
                      # Remove the output location on stack deletion
                      athena.update_work_group(
                          WorkGroup='primary',
                          ConfigurationUpdates={
                              'ResultConfigurationUpdates': {
                                  'RemoveOutputLocation': True
                              }
                          }
                      )
                      logger.info('Removed primary workgroup result configuration')
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  else:
                      output_location = event['ResourceProperties']['OutputLocation']
                      athena.update_work_group(
                          WorkGroup='primary',
                          ConfigurationUpdates={
                              'ResultConfigurationUpdates': {
                                  'OutputLocation': output_location
                              },
                              'EnforceWorkGroupConfiguration': False
                          }
                      )
                      logger.info(f'Set primary workgroup output to {output_location}')
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  logger.error(f'Error: {e}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(e))

  ConfigureAthenaPrimaryWorkgroup:
    Type: Custom::ConfigureAthenaPrimaryWorkgroup
    Properties:
      ServiceToken: !GetAtt ConfigureAthenaPrimaryWorkgroupLambda.Arn
      OutputLocation: !Sub s3://${AWS::Partition}-athena-query-results-${AWS::AccountId}-${AWS::Region}/results/

